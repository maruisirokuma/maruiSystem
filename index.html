<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#2E7D32"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-title" content="サンドイッチ"/>
  <link rel="manifest" href="manifest.json"/>
  <title>サンドイッチ販売支援</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>
<div id="app">
  <header class="app-header">
    <div class="header-content">
      <button class="menu-btn" id="menuBtn" aria-label="メニュー">☰</button>
      <h1 class="header-title" id="headerTitle">ダッシュボード</h1>
      <div class="header-date" id="headerDate"></div>
    </div>
  </header>

  <nav class="drawer" id="drawer" aria-hidden="true">
    <div class="drawer-header">
      <div class="drawer-logo">🥪</div>
      <div class="drawer-store">サンドイッチ販売支援</div>
      <button class="drawer-close" id="drawerClose">✕</button>
    </div>
    <ul class="nav-list">
      <li><a class="nav-item active" data-page="dashboard"   href="#"><span class="nav-icon">📊</span>ダッシュボード</a></li>
      <li><a class="nav-item"        data-page="manufacture" href="#"><span class="nav-icon">🏭</span>製造計算</a></li>
      <li><a class="nav-item"        data-page="loss"        href="#"><span class="nav-icon">📉</span>ロス計算</a></li>
      <li><a class="nav-item"        data-page="discount"    href="#"><span class="nav-icon">🏷️</span>割引分析</a></li>
      <li><a class="nav-item"        data-page="report"      href="#"><span class="nav-icon">📝</span>日報</a></li>
      <li><a class="nav-item"        data-page="products"    href="#"><span class="nav-icon">🛒</span>商品管理</a></li>
      <li><a class="nav-item"        data-page="settings"    href="#"><span class="nav-icon">⚙️</span>設定</a></li>
    </ul>
  </nav>
  <div class="drawer-overlay" id="drawerOverlay"></div>

  <main class="main-content" id="mainContent"></main>
  <div class="toast" id="toast"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
